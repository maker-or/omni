name: Release macOS Launcher

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Launcher version (must match package.json)"
        required: true
      release_repository:
        description: "Target repo for launcher releases (owner/repo)"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: macos-launcher-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PIPPER_RELEASE_REPOSITORY: ${{ github.event.inputs.release_repository || vars.PIPPER_RELEASE_REPOSITORY || github.repository }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require Apple Silicon
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "Mac launcher DMG must be built on arm64. Runner arch is $(uname -m)."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate release repository
        run: |
          if [[ -z "${PIPPER_RELEASE_REPOSITORY}" ]]; then
            echo "Set the PIPPER_RELEASE_REPOSITORY repository variable (for example maker-or/pipper-code-releases),"
            echo "or provide release_repository when running this workflow manually."
            exit 1
          fi

      - name: Resolve launcher version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ "$VERSION" == win/* ]]; then
            echo "Windows tags (win/v*) do not publish the macOS launcher."
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Requested version $VERSION does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # fmt / lint / test live in .github/workflows/ci.yml (every PR + main push).
      # This workflow only builds and publishes the macOS DMG.

      - name: Build application
        run: bun run build

      # Packaging only. `dist` pins `--publish never`, because electron-builder
      # otherwise auto-publishes on a tagged CI build and would cut its own
      # `v${version}` release. The publish step below owns that tag.
      - name: Build macOS DMG
        run: |
          rm -rf release
          bun run dist

      - name: Publish macOS launcher release
        env:
          GH_TOKEN: ${{ secrets.PIPPER_RELEASE_TOKEN || github.token }}
        run: bun run release:launcher:publish -- --resume --skip-git-check
